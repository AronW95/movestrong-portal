<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoveStrong Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#000;--card:#0d1214;--line:#1f2b2e;--fg:#f2f6f7;--mut:#8a9a9e;--c:#00D4E8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Barlow,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1.05;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,8vw,4rem)}h2{font-size:1.8rem}h3{font-size:1.25rem}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{font:700 1.6rem 'Barlow Condensed';letter-spacing:.02em}.logo b{color:var(--c)}
main{max-width:680px;margin:0 auto;padding:28px 20px 80px}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);padding:18px;margin:0 0 14px}
label{display:block;margin:16px 0 6px;font-weight:500}
input,textarea,select{width:100%;background:#000;color:var(--fg);border:1px solid var(--line);padding:11px;font:inherit;border-radius:0}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--c);outline-offset:2px}
button,.btn{background:var(--c);color:#000;border:0;padding:11px 20px;font:700 1rem 'Barlow Condensed';letter-spacing:.03em;cursor:pointer;text-decoration:none;display:inline-block;margin-top:14px}
button.ghost{background:none;color:var(--c);border:1px solid var(--c)}button:disabled{opacity:.5}
a{color:var(--c)}.mut{color:var(--mut)}.err{color:#ff7a7a}.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);padding:9px 14px;cursor:pointer;background:#000;color:var(--fg);margin:0}.opt.on{border-color:var(--c);background:var(--c);color:#000}
.days{display:flex;gap:6px;flex-wrap:wrap}.day{width:44px;height:44px;margin:0;padding:0}.day.done{background:var(--c);color:#000}
.day.done{cursor:default}
@media(prefers-reduced-motion:no-preference){main>*{animation:in .3s both}@keyframes in{from{opacity:0}}}
</style></head><body>
<header><div class="logo"><b>MOVE</b>STRONG</div><nav id="nav"></nav></header><main id="app"></main>
<script>addEventListener('error',e=>{const a=document.getElementById('app');a.textContent='Setup problem: '+e.message+(/token|string|identifier/i.test(e.message)?' (check the CFG line for curly quotes or a missing quote or comma)':'')});</script>
<script>
const CFG={url:'https://emqebqugufovcqzralyy.supabase.co',key:'PASTE_ANON_KEY_HERE',hubSite:'HUB_URL'};
const $=s=>document.querySelector(s),app=$('#app');
if(typeof supabase==='undefined')throw new Error('The Supabase library did not load. Check your connection or ad blocker.');
if(CFG.key.length<30||CFG.key.includes('PASTE'))throw new Error('Paste your Supabase anon key into the CFG line near the top of the script.');
const sb=supabase.createClient(CFG.url,CFG.key);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))x.startsWith('on')?e.addEventListener(x.slice(2),v):x==='class'?e.className=v:e.setAttribute(x,v);k.flat().forEach(c=>e.append(c?.nodeType?c:(c??'')));return e};
const show=(...n)=>{app.replaceChildren(...n)};
let me=null,profile=null;
// Hub link: ?hub=<clientId> is remembered and saved to the account at sign-up
const hubParam=new URLSearchParams(location.search).get('hub');if(hubParam)sessionStorage.setItem('hub',hubParam);

async function boot(){const{data:{session}}=await sb.auth.getSession();me=session?.user||null;
 if(me){profile=(await sb.from('profiles').select('*').eq('id',me.id).single()).data;
  if(sessionStorage.getItem('hub')&&profile&&!profile.hub_client_id){await sb.from('profiles').update({hub_client_id:sessionStorage.getItem('hub'),source:'client'}).eq('id',me.id)}}
 $('#nav').replaceChildren(...(me?[profile?.role==='coach'?h('a',{href:'#/coach'},'Coach view  '):'',h('button',{class:'ghost',style:'margin:0',onclick:async()=>{await sb.auth.signOut();location.hash='';boot()}},'Log out')]:[]));
 route()}
sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_IN'&&!me)boot()});
addEventListener('hashchange',route);

function route(){const[,p,a]=location.hash.split('/');
 if(!me)return authView();
 if(p==='q')return questionnaire(a);if(p==='c')return challenge(a);if(p==='coach'&&profile?.role==='coach')return coach();home()}

function authView(mode='up'){const msg=h('p',{class:'err'});
 const f=h('div',{},h('h1',{},mode==='up'?'Create your account':'Welcome back'),
  h('p',{class:'mut'},'Your questionnaires and challenges are saved to your account, so you can come back any time.'),
  mode==='up'?[h('label',{},'Name'),h('input',{id:'n',autocomplete:'name'})]:'',
  h('label',{},'Email'),h('input',{id:'e',type:'email',autocomplete:'email'}),
  h('label',{},'Password (8+ characters)'),h('input',{id:'p',type:'password',autocomplete:mode==='up'?'new-password':'current-password'}),msg,
  h('button',{onclick:async()=>{const email=$('#e').value.trim(),password=$('#p').value;msg.textContent='';
   const r=mode==='up'?await sb.auth.signUp({email,password,options:{data:{full_name:$('#n').value.trim(),hub_client_id:sessionStorage.getItem('hub')}}}):await sb.auth.signInWithPassword({email,password});
   if(r.error)msg.textContent=r.error.message;else if(mode==='up'&&!r.data.session)show(h('h2',{},'Check your email'),h('p',{},'Confirm your address, then log in.'))}},mode==='up'?'Create account':'Log in'),
  h('p',{},mode==='up'?'Already registered? ':'New here? ',h('a',{href:'#',onclick:e=>{e.preventDefault();authView(mode==='up'?'in':'up')}},mode==='up'?'Log in':'Create an account')));
 show(f)}

async function home(){show(h('p',{class:'mut'},'Loading…'));
 const[{data:qs},{data:cs},{data:rs},{data:es}]=await Promise.all([sb.from('questionnaires').select('*').eq('active',true),sb.from('challenges').select('*').eq('active',true),sb.from('responses').select('questionnaire_id').eq('user_id',me.id),sb.from('enrolments').select('challenge_id').eq('user_id',me.id)]);
 const done=new Set(rs.map(r=>r.questionnaire_id)),joined=new Set(es.map(e=>e.challenge_id));
 show(h('h1',{},`Hi ${(profile?.full_name||'there').split(' ')[0]}`),
  h('h2',{},'Questionnaires'),qs.map(q=>h('div',{class:'card'},h('h3',{},q.title),h('p',{class:'mut'},q.intro||''),h('a',{class:'btn',href:'#/q/'+q.slug},done.has(q.id)?'Retake':'Start'))),
  h('h2',{},'Challenges'),cs.map(c=>h('div',{class:'card'},h('h3',{},c.title),h('p',{class:'mut'},c.description),h('a',{class:'btn',href:'#/c/'+c.id},joined.has(c.id)?'Open check-ins':'Join challenge'))),
  profile?.hub_client_id?h('p',{class:'mut'},'Linked to your MoveStrong coaching account.'):'')}

async function questionnaire(slug){const{data:q}=await sb.from('questionnaires').select('*').eq('slug',slug).single();if(!q)return home();
 const ans={};const fields=q.questions.map(x=>{let el;
  if(x.type==='textarea')el=h('textarea',{rows:3,oninput:e=>ans[x.id]=e.target.value});
  else if(x.type==='scale'||x.type==='choice'){const opts=x.type==='scale'?Array.from({length:x.max-x.min+1},(_,i)=>String(x.min+i)):x.options;
   el=h('div',{class:'row'},opts.map(o=>h('button',{class:'opt',onclick:e=>{ans[x.id]=o;[...e.target.parentNode.children].forEach(b=>b.classList.toggle('on',b===e.target))}},o)))}
  else el=h('input',{oninput:e=>ans[x.id]=e.target.value});
  return[h('label',{},x.label),el]});
 const msg=h('p',{class:'err'});
 show(h('h1',{},q.title),h('p',{class:'mut'},q.intro||''),fields,msg,h('button',{onclick:async e=>{
  if(q.questions.some(x=>!ans[x.id]&&x.type!=='textarea')){msg.textContent='Answer every question except the optional text boxes.';return}
  e.target.disabled=true;const{error}=await sb.from('responses').insert({user_id:me.id,questionnaire_id:q.id,answers:ans});
  if(error){msg.textContent=error.message;e.target.disabled=false}else show(h('h1',{},'Thanks, got it'),h('p',{},'Your answers are saved to your account.'),h('a',{class:'btn',href:'#/home'},'Back to dashboard'))}},'Save answers'))}

async function challenge(id){const{data:c}=await sb.from('challenges').select('*').eq('id',id).single();if(!c)return home();
 await sb.from('enrolments').upsert({user_id:me.id,challenge_id:id},{ignoreDuplicates:true});
 const{data:en}=await sb.from('enrolments').select('started_on').eq('user_id',me.id).eq('challenge_id',id).single();
 const{data:ck}=await sb.from('checkins').select('day').eq('user_id',me.id).eq('challenge_id',id);const done=new Set(ck.map(x=>x.day));
 const today=Math.floor((Date.now()-new Date(en.started_on+'T00:00:00'))/864e5)+1;
 const note=h('textarea',{rows:2,placeholder:'How did it go? (optional)'}),msg=h('p',{class:'mut'});
 show(h('h1',{},c.title),h('p',{class:'mut'},c.description),h('p',{},`${done.size} of ${c.days} days checked in`),
  h('div',{class:'days'},Array.from({length:c.days},(_,i)=>i+1).map(d=>h('button',{class:'day'+(done.has(d)?' done':''),disabled:done.has(d)||d>today,onclick:async()=>{
   const{error}=await sb.from('checkins').insert({user_id:me.id,challenge_id:id,day:d,note:note.value});if(error)msg.textContent=error.message;else challenge(id)}},d))),
  h('label',{},'Note for the day you tap'),note,msg,h('p',{class:'mut'},'Tap a day to check in. Future days unlock as the challenge runs.'),h('a',{href:'#/home'},'Back to dashboard'))}

async function coach(){const{data:rs}=await sb.from('responses').select('*,questionnaires(title,questions),profiles:user_id(full_name,email,hub_client_id)').order('created_at',{ascending:false}).limit(50);
 const{data:ck}=await sb.from('checkins').select('user_id,challenge_id');const n={};ck.forEach(c=>n[c.user_id]=(n[c.user_id]||0)+1);
 show(h('h1',{},'Coach view'),h('p',{class:'mut'},'Latest questionnaire responses. The hub bridge pulls the same data.'),
  rs.map(r=>h('div',{class:'card'},h('h3',{},`${r.profiles?.full_name||'Unnamed'} · ${r.questionnaires.title}`),
   h('p',{class:'mut'},`${r.profiles?.email} · ${r.profiles?.hub_client_id?'client':'lead'} · ${n[r.user_id]||0} check-ins · ${new Date(r.created_at).toLocaleDateString('en-GB')}`),
   r.questionnaires.questions.map(q=>h('p',{},h('b',{},q.label+' '),String(r.answers[q.id]??'–'))))))}
boot();
</script></body></html>
